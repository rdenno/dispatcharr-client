# Dispatcharr mobile UI: nginx pieces for the Dispatcharr server block.
#
# 1. The two `map` blocks go in the http context (e.g. top of the site file, outside any server {}).
# 2. The two `location` blocks go inside the Dispatcharr `server {}`, next to `location /`.
# 3. Built files go in /var/www/dispatcharr-mobile/m/ (deploy.sh does this).

# Phones get the mobile UI when they open "/", unless they chose the full UI in the app
# (cookie dispatcharr_ui=desktop). Tablets and "Request desktop site" send desktop
# user agents, so they get the full UI.
map $http_user_agent $dispatcharr_is_phone {
    default 0;
    "~*(iPhone|iPod|Android.+Mobile|Mobile Safari|Windows Phone)" 1;
}
map "$dispatcharr_is_phone:$cookie_dispatcharr_ui" $dispatcharr_mobile_redirect {
    default 0;
    "1:" 1;
    "1:mobile" 1;
}

# --- inside the Dispatcharr server {} ---

    # Phone landing on the root: send to the mobile UI. Everything else (API, proxy,
    # desktop SPA routes) still goes to Dispatcharr through `location /`.
    location = / {
        include /etc/nginx/snippets/authelia-authrequest.conf;
        if ($dispatcharr_mobile_redirect) {
            return 302 /m/;
        }
        proxy_pass http://172.28.159.21:9191;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # PWA install metadata must load without the Authelia cookie (Chrome fetches the manifest
    # and icons without credentials, and falls back to a plain shortcut if they fail).
    # These files are only the app name and Dispatcharr's logo.
    location = /m/manifest.webmanifest {
        root /var/www/dispatcharr-mobile;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /m/icon-192.png { root /var/www/dispatcharr-mobile; }
    location = /m/icon-512.png { root /var/www/dispatcharr-mobile; }
    location = /m/favicon-32.png { root /var/www/dispatcharr-mobile; }

    # Stream health scanner (scanner/) on the Dispatcharr host; nginx adds its shared token
    location ^~ /m/health/ {
        include /etc/nginx/snippets/authelia-authrequest.conf;
        proxy_pass http://172.28.159.21:9393/;
        proxy_set_header X-Scanner-Token "<SCANNER_TOKEN from scanner/.env>";
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    # Mobile UI static files (single-page app: unknown paths fall back to index.html)
    location ^~ /m/ {
        include /etc/nginx/snippets/authelia-authrequest.conf;
        root /var/www/dispatcharr-mobile;
        try_files $uri /m/index.html;
        # index.html and sw.js must be revalidated to pick up deploys
        add_header Cache-Control "no-cache";
        # Hashed assets never change
        location ^~ /m/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
